<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tənqidi realizm · Cəlil Məmmədquluzadə</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--iv:#f5eee3;--cr:#eadcc8;--bu:#5a3a28;--te:#99592b;--br:#2e2018;--mu:#5c4838;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--iv);color:var(--br);font:16px/1.7 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;color:var(--bu);line-height:1.2;font-weight:800;letter-spacing:-.01em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(245,238,227,.95);backdrop-filter:blur(6px);border-bottom:1px solid #d6c4a8;display:flex;gap:6px;align-items:center;padding:10px 16px;overflow-x:auto;white-space:nowrap}
nav a{color:var(--br);text-decoration:none;font-size:14px;padding:4px 9px;border-radius:14px}nav a:hover{background:var(--cr);color:var(--bu)}
.lang{margin-left:auto;display:flex;gap:4px;flex:none}.lang button{border:1px solid var(--bu);background:none;color:var(--bu);padding:4px 10px;border-radius:14px;cursor:pointer;font:inherit;font-size:14px}.lang button.on{background:var(--bu);color:var(--iv)}
section{padding:84px 6vw;max-width:1080px;margin:auto}section:nth-of-type(even){background:var(--cr);max-width:none}section:nth-of-type(even)>.in{max-width:1080px;margin:auto}
h2{font-size:clamp(28px,4vw,40px);margin:0 0 8px}.lead{max-width:68ch;color:var(--mu);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-top:28px}
.card{background:var(--iv);border-left:3px solid var(--te);padding:20px 22px;border-radius:2px 10px 10px 2px;transition:transform .25s}.card:hover{transform:translateY(-3px)}
.card h3{margin:0 0 6px;font-size:19px}.card p{margin:0}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center;min-height:86vh}
.hero h1{font-size:clamp(34px,5.5vw,62px);margin:0 0 14px}.hero img{width:100%;border:10px solid #fff;box-shadow:0 14px 40px rgba(58,42,34,.25);filter:grayscale(.15)}
.buta{width:46px;fill:var(--te);opacity:.8}
.tl{border-left:2px solid var(--te);margin:30px 0 0 8px;padding-left:26px}.tl div{margin-bottom:20px;position:relative}.tl div:before{content:"";position:absolute;left:-33px;top:8px;width:12px;height:12px;background:var(--bu);border-radius:50%}.tl b{font:600 20px Fraunces,Georgia,serif;color:var(--bu);margin-right:10px}
table{width:100%;border-collapse:collapse;margin-top:26px;background:var(--iv)}th,td{padding:14px;border-bottom:1px solid #d6c4a8;text-align:left;vertical-align:top}th{background:var(--bu);color:var(--iv);font-family:Fraunces,serif}td:first-child{color:var(--te);font-weight:500;width:18%}
.wrap{overflow-x:auto}.tag{display:inline-block;font-size:12px;color:var(--te);border:1px solid var(--te);border-radius:10px;padding:0 8px;margin-top:8px}
.q{margin:26px 0;padding:20px;background:var(--cr);border-radius:10px}.q p{margin:0 0 10px;font-weight:500}
.o{display:block;padding:9px 12px;margin:6px 0;border:1px solid #d6c4a8;border-radius:8px;cursor:pointer;background:var(--iv)}.o:hover{border-color:var(--bu)}.o.sel{border-color:var(--bu);background:#ead5bd}
.o.ok{background:#e1ecd8;border-color:#5c7f4a}.o.no{background:#f4d9d4;border-color:#a8473a}.ex{margin-top:10px;font-size:16px;color:var(--br);color:var(--mu)}
.btn{background:var(--bu);color:var(--iv);border:0;padding:12px 26px;border-radius:24px;font:inherit;cursor:pointer;margin-right:10px}.btn:hover{background:var(--te)}.btn:focus-visible,.lang button:focus-visible{outline:3px solid var(--te)}
.score{font:600 36px Fraunces,serif;color:var(--bu)}
.team .card{text-align:center;border:1px solid #d6c4a8;border-radius:10px}.av{width:56px;height:56px;border-radius:50%;background:var(--bu);color:var(--iv);display:grid;place-items:center;margin:0 auto 10px;font:600 20px Fraunces,serif}
.mono{aspect-ratio:3/4;display:grid;place-items:center;background:var(--bu);color:var(--iv);font:600 64px Fraunces,serif;max-width:200px;margin:14px 0}
footer ol{font-size:15px;color:var(--mu)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--br);color:var(--iv);padding:10px 20px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:20}.toast.on{opacity:1}
@media(max-width:800px){.hero{grid-template-columns:1fr;min-height:0}section{padding:56px 6vw}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.card{border-left:0;border-top:4px solid var(--te);border-radius:0 0 8px 8px;box-shadow:0 6px 18px rgba(90,58,40,.1)}.team .card{border:1px solid #d6c4a8;border-top:4px solid var(--te)}
.btn{border-radius:4px;background:var(--bu)}.btn:hover{background:#3d2518}.o{border-radius:4px}th{letter-spacing:.01em}
#top{box-shadow:0 0 0 100vmax var(--bu);clip-path:inset(0 -100vmax);color:#f5eee3}#top h1{color:#fff;font-size:clamp(38px,6.5vw,76px)}#top .lead{color:#ecdcc4}#top figcaption{color:#ecdcc4!important}#top .buta{fill:var(--te)}#top img{border-color:var(--te);filter:grayscale(.15)}
.mb{display:none;background:none;border:1px solid var(--bu);color:var(--bu);border-radius:6px;font-size:20px;line-height:1;padding:6px 12px;cursor:pointer}.ln{display:flex;gap:6px;overflow-x:auto}
@media(max-width:800px){nav{flex-wrap:wrap;overflow:visible}.mb{display:block}.ln{display:none;order:3;width:100%;flex-direction:column;padding-top:6px}nav.open .ln{display:flex}.ln a{padding:11px 8px;border-bottom:1px solid #d6c4a8;border-radius:0}.lang{margin-left:auto}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main><footer id="ft" style="padding:30px 6vw 60px;max-width:1080px;margin:auto"></footer><div class="toast" id="ts"></div>

["Cəlil Məmmədquluzadə (1869–1932)","Naxçıvanda doğulub, Bakıda vəfat edib. Müəllim, nasir, dramaturq və jurnalist idi. 1906-cı ildə Tiflisdə “Molla Nəsrəddin” satirik jurnalını yaratdı; 1921-ci ildə Təbrizdə nəşr etdi, 1922-də Bakıya qayıtdı. “Poçt qutusu” (1904) və “Danabaş kəndinin əhvalatları” kimi hekayələri, “Ölülər” və “Anamın kitabı” kimi əsərləri ilə sadə dildə xalqın problemlərini göstərdi.",[]],
["Anamın kitabı (My Mother’s Book)","Təxminən 1920-ci ildə yazılmış avtobioqrafik xarakterli əsər: müəllifin uşaqlıq xatirələri və ana obrazı mərkəzdədir. Aşağıdakı oxu şərhdir; dəqiq süjet detalları mətnlə yoxlanmalıdır.",[["Tarixi-sosial fon","Kənd həyatı, imperiya şəraitində mədəni parçalanma və ana dilinin yeri."],["Obrazlar və rollar","Ana — yaddaş və doğma mühitin daşıyıcısı; müəllif-nağıl edən — o dünyaya geri baxan şəxs; kənd camaatı — ictimai fon."],["Mövzu və mesajlar","Ana dili, mədəni yadlaşma və milli kimliyin qorunması (şərh)."],["Simvolika","Ana — vətən və dil; onun kitabı — xalq yaddaşı və ona sadiqlik (şərh)."],["Tənqidi realizm","Mətndə gündəlik həyat detalları vasitəsilə cəmiyyətin mədəni yönümsüzlüyü göstərilir."],["Bu gün","Dil, identiklik və kökə münasibət mövzuları aktuallığını saxlayır."]]],
["Ölülər (The Dead)","1909-cu ildə tamamlanmış satirik pyes. Əsas tənqid hədəfi dini nüfuzdan sui-istifadə edən Şeyx Nəsrullah tipidir.",[["Tarixi-sosial fon","1905-ci il inqilabından sonrakı dövr, mövhumat və fanatizm mühiti."],["Obrazlar","Şeyx Nəsrullah — riyakar din xadimi; ətrafındakılar — kor-koranə inanan icma. Digər obrazlar üçün mətnə baxın."],["Başlığın mənası","“Ölülər” yalnız mərhumlar deyil, düşünməyən, ruhən ölmüş insanlardır (şərh)."],["Tənqid","Cəhalət, mövhumat, dini istismar və ənənəyə kor-koranə tabelik."],["Görüntü və gerçəklik","Zahiri dindarlıq və əsl əxlaq arasındakı ziddiyyət satira və tragikomik üslubla ifşa olunur."],["Müasir cəmiyyət","Manipulyasiya və tənqidsiz qəbul bu gün də aktualdır."]]],

h:["Critical Realism and Its Foundations","A digital literary exhibition on Jalil Mammadguluzadeh’s “Anamın kitabı” (My Mother’s Book) and “Ölülər” (The Dead)","Critical realism is a literary method that shows life without embellishment, exposes social flaws and calls for change. This project explains it through the work of Jalil Mammadguluzadeh."],
sec:[
["What is critical realism?","An approach in Azerbaijani literature rooted in enlightenment ideas and taking shape from the mid-nineteenth century.",[["Definition","Critical realism depicts life as it is, reveals the social causes of its flaws and presents typical characters in typical circumstances."],["Main characteristics","Realistic portrayal of society, criticism of social injustice, exposure of ignorance, desire for reform."],["Literature as a tool of criticism","Theatre, press and satire reached wide audiences; laughter became a weapon against ignorance."]]],
["Historical foundations and timeline","Economic change, contact with Russian and European culture, and the new press and theatre created an enlightenment environment.",[]],
["Jalil Mammadguluzadeh (1869–1932)","Born in Nakhchivan, died in Baku. A teacher, prose writer, dramatist and journalist. In 1906 he founded the satirical journal Molla Nasreddin in Tiflis; he published it in Tabriz in 1921 and returned to Baku in 1922. Through stories such as “Poçt qutusu” (The Mailbox, 1904) and “Danabaş kəndinin əhvalatları”, and works like “Ölülər” and “Anamın kitabı”, he used plain language to show the people’s problems.",[]],
["Anamın kitabı (My Mother’s Book)","An autobiographical work written around 1920, centred on the author’s childhood memories and the figure of his mother. The reading below is interpretation; exact plot details should be checked against the text.",[["Historical and social background","Village life, cultural fragmentation under imperial rule and the place of the mother tongue."],["Characters and roles","The mother carries memory and the native world; the narrator looks back on it; the villagers form the social backdrop."],["Themes and messages","Mother tongue, cultural alienation and preserving national identity (interpretation)."],["Symbolism","The mother stands for homeland and language; her book for collective memory and loyalty to it (interpretation)."],["Critical realism","Everyday detail exposes a society’s cultural disorientation."],["Relevance today","Language, identity and relation to one’s roots remain current."]]],
["Ölülər (The Dead)","A satirical play completed in 1909. Its main target is the type of Sheikh Nasrullah, who abuses religious authority.",[["Historical and social background","The period after the 1905 revolution, marked by superstition and fanaticism."],["Characters","Sheikh Nasrullah, a hypocritical cleric; his surroundings, a community of blind believers. See the text for other characters."],["Meaning of the title","“The Dead” are not only the deceased but people who do not think, spiritually dead (interpretation)."],["Criticism","Ignorance, superstition, religious exploitation and blind obedience to tradition."],["Appearance vs. reality","Outward piety is set against real morality through satire and tragicomedy."],["Modern society","Manipulation and uncritical acceptance remain relevant."]]],
["Critical realism in both works","",[["Shared themes","Ignorance, alienation and social inertia."],["Method","Everyday detail, typical characters, satire and irony."],["Purpose","To make readers think and to call for reform."]]],
["Comparison with Mirza Fatali Akhundzade","Both writers were enlightenment figures who believed in progress through education and reason and criticized ignorance and superstition.",[]],
["Overall conclusions","In Mammadguluzadeh’s work, critical realism turns literature into a social appeal. “Anamın kitabı” looks critically at identity, “Ölülər” at ignorance and hypocrisy. Together with Akhundzade, he shaped the Azerbaijani enlightenment-realist tradition."],
